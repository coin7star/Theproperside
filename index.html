<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Asisten AI pintar dengan fitur multi-model (Gemini & Groq Llama 3) yang responsif, SEO friendly, dan cepat.">
    <meta name="theme-color" content="#4f46e5">
    <link rel="canonical" href="https://theproperside.vercel.app">
    
    <title>Asisten AI Multi-Model - Chat Pintar & Cepat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chat-msg { max-width: 90%; margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 1rem; line-height: 1.6; }
        .msg-user { align-self: flex-end; background-color: #4f46e5; color: white; }
        .msg-ai { align-self: flex-start; background-color: #f3f4f6; color: #1f2937; }
        
        /* Perbaikan CSS untuk Code Block */
        pre { background: #282c34 !important; border-radius: 0.5rem; padding: 1rem !important; margin: 0.5rem 0; position: relative; overflow-x: auto; }
        code { font-family: 'Fira Code', 'Consolas', monospace; font-size: 0.875rem; color: #abb2bf; display: block; overflow-x: auto; white-space: pre; }
        .copy-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: #4b5563; color: white; padding: 0.25rem 0.5rem; font-size: 0.7rem; border-radius: 0.25rem; cursor: pointer; z-index: 20; }
        .copy-btn:hover { background: #374151; }
        
        #initial-loader { position: fixed; inset: 0; background: white; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

    <div id="initial-loader">
        <p class="text-sm text-gray-500">Menyiapkan asisten AI Anda...</p>
    </div>

    <header class="bg-white border-b border-gray-200 shadow-sm z-10 flex-shrink-0 opacity-0 transition-opacity duration-500" id="main-header">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="font-bold text-lg text-indigo-600">Multi AI Chat</h1>
            <div class="flex items-center gap-3">
                <select id="model-selector" class="bg-gray-50 border border-gray-300 text-xs rounded-lg p-2 cursor-pointer outline-none">
                    <option value="gemini">Gemini 3.1</option>
                    <option value="groq">Groq (Llama 3)</option>
                </select>
                <button id="login-btn" onclick="loginGoogle()" class="hidden bg-blue-600 text-white text-xs py-1.5 px-3 rounded-lg hover:bg-blue-700 transition">Login</button>
                <div id="user-profile" class="hidden items-center gap-2">
                    <img id="user-avatar" src="" class="w-8 h-8 rounded-full border shadow-sm">
                    <button onclick="logout()" class="text-gray-400 text-xs hover:text-red-500">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto w-full max-w-5xl mx-auto p-4 flex flex-col opacity-0 transition-opacity duration-500"></main>

    <footer id="main-footer" class="bg-white border-t p-3 pb-6 flex-shrink-0 opacity-0 transition-opacity duration-500">
        <div class="max-w-5xl mx-auto relative flex items-end gap-2">
            <textarea id="user-input" disabled class="w-full bg-gray-50 border border-gray-300 text-sm rounded-2xl p-4 pr-12 outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-60" placeholder="Ketik pesan Anda..."></textarea>
            <button id="send-btn" disabled onclick="sendMessage()" class="absolute right-3 bottom-3 p-2 bg-indigo-600 text-white rounded-full shadow-md hover:bg-indigo-700 transition">Kirim</button>
        </div>
    </footer>

    <script>
        window.myAppSupabase = null;
        let currentUser = null;

        async function waitForSupabase() {
            return new Promise((resolve) => {
                const check = () => {
                    if (window.supabase && window.supabase.createClient) resolve();
                    else setTimeout(check, 100);
                };
                check();
            });
        }

        function copyToClipboard(btn) {
            const codeBlock = btn.nextElementSibling;
            const code = codeBlock.innerText;
            navigator.clipboard.writeText(code);
            const originalText = btn.innerText;
            btn.innerText = 'Tersalin!';
            setTimeout(() => btn.innerText = originalText, 2000);
        }

        function appendMessage(text, isUser) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `chat-msg ${isUser ? 'msg-user' : 'msg-ai'}`;
            
            const renderer = new marked.Renderer();
            renderer.code = (code, lang) => {
                const escapedCode = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                return `<pre><button class="copy-btn" onclick="copyToClipboard(this)">Salin</button><code>${escapedCode}</code></pre>`;
            };
            
            div.innerHTML = DOMPurify.sanitize(marked.parse(text, { renderer }));
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            hljs.highlightAll();
        }

        function handleAuthState(session) {
            currentUser = session?.user;
            const loginBtn = document.getElementById('login-btn');
            const userProfile = document.getElementById('user-profile');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');

            if (currentUser) {
                loginBtn.classList.add('hidden');
                userProfile.classList.remove('hidden');
                document.getElementById('user-avatar').src = currentUser.user_metadata?.avatar_url || '';
                userInput.disabled = false;
                sendBtn.disabled = false;
            } else {
                loginBtn.classList.remove('hidden');
                userProfile.classList.add('hidden');
                userInput.disabled = true;
                sendBtn.disabled = true;
            }
        }

        async function loginGoogle() {
            if (!window.myAppSupabase) return;
            await window.myAppSupabase.auth.signInWithOAuth({ 
                provider: 'google',
                options: { redirectTo: window.location.origin }
            });
        }

        async function logout() {
            if (!window.myAppSupabase) return;
            await window.myAppSupabase.auth.signOut();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const modelSelector = document.getElementById('model-selector');
            const text = input.value.trim();
            if(!text) return;
            
            appendMessage(text, true);
            input.value = '';
            input.disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, modelProvider: modelSelector.value })
                });

                const data = await response.json();
                if (data.reply) {
                    appendMessage(data.reply, false);
                } else {
                    appendMessage("Error: " + (data.error || "Terjadi kesalahan."), false);
                }
            } catch (err) {
                appendMessage("Gagal terhubung ke server AI: " + err.message, false);
            } finally {
                input.disabled = false;
                input.focus();
            }
        }

        async function initApp() {
            try {
                await waitForSupabase();
                const supabaseUrl = "https://mjvgnxiudhnuaccxnsnh.supabase.co"; 
                const supabaseAnonKey = "sb_publishable_-zoS7TeFgb9QZkhnuZe28A_jnj1Xno6";
                
                if (supabaseUrl && supabaseAnonKey && !supabaseUrl.includes("MASUKKAN")) {
                    window.myAppSupabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
                    const { data: { session } } = await window.myAppSupabase.auth.getSession();
                    handleAuthState(session);
                    window.myAppSupabase.auth.onAuthStateChange((_, session) => handleAuthState(session));
                }

                document.getElementById('initial-loader').style.display = 'none';
                document.getElementById('main-header').classList.remove('opacity-0');
                document.getElementById('chat-container').classList.remove('opacity-0');
                document.getElementById('main-footer').classList.remove('opacity-0');
            } catch (err) {
                console.error(err);
            }
        }
        
        initApp();
    </script>
</body>
</html>
