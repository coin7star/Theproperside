<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Asisten AI pintar dengan fitur multi-model (Gemini & Groq Llama 3) yang responsif dan cepat.">
    <meta name="theme-color" content="#4f46e5">
    
    <title>Asisten AI Multi-Model & Supabase</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .markdown-body p { margin-bottom: 0.75em; line-height: 1.6; }
        .code-block-wrapper { position: relative; margin-bottom: 1em; border-radius: 0.5rem; overflow: hidden; background-color: #282c34; }
        .code-header { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 1rem; background-color: #1e2227; color: #abb2bf; font-size: 0.75rem; font-family: monospace; border-bottom: 1px solid #181a1f; }
        .markdown-body pre { margin: 0; padding: 1rem; overflow-x: auto; overflow-y: auto; max-height: 400px; font-size: 0.875rem; color: #abb2bf; }
        .copy-btn { background: rgba(255, 255, 255, 0.1); border: none; color: #abb2bf; padding: 0.25rem 0.5rem; border-radius: 0.25rem; cursor: pointer; display: flex; align-items: center; gap: 0.25rem; }
        .copy-btn:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
        .copy-btn.copied { background: #10b981; color: white; }
        #initial-loader { position: fixed; inset: 0; background: white; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

    <div id="initial-loader">
        <p class="text-sm text-gray-500">Menyiapkan koneksi aman...</p>
    </div>

    <header class="bg-white border-b border-gray-200 shadow-sm z-10 flex-shrink-0 opacity-0 transition-opacity duration-500" id="main-header">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="font-bold text-lg text-indigo-600">Multi AI Chat</h1>
            <div class="flex items-center gap-3">
                <select id="model-selector" class="bg-gray-50 border border-gray-300 text-xs rounded-lg p-2 cursor-pointer outline-none">
                    <option value="gemini">Gemini 3.1</option>
                    <option value="groq">Groq (Llama 3)</option>
                </select>
                <button id="login-btn" onclick="loginGoogle()" class="hidden bg-blue-600 text-white text-xs py-1.5 px-3 rounded-lg">Login</button>
                <div id="user-profile" class="hidden items-center gap-2">
                    <img id="user-avatar" src="" class="w-8 h-8 rounded-full border shadow-sm">
                    <button onclick="logout()" class="text-gray-400">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto w-full max-w-5xl mx-auto p-4 flex flex-col gap-6 opacity-0 transition-opacity duration-500"></main>

    <footer id="main-footer" class="bg-white border-t p-3 pb-6 flex-shrink-0 opacity-0 transition-opacity duration-500">
        <div class="max-w-5xl mx-auto relative flex items-end gap-2">
            <textarea id="user-input" disabled class="w-full bg-gray-50 border border-gray-300 text-sm rounded-2xl p-4 pr-12 outline-none disabled:opacity-60" placeholder="Login untuk mulai chat..."></textarea>
            <button id="send-btn" disabled onclick="sendMessage()" class="absolute right-3 bottom-3 p-2 bg-indigo-600 text-white rounded-full shadow-md">Kirim</button>
        </div>
    </footer>

    <script>
        window.myAppSupabase = null;
        let currentUser = null;

        async function waitForSupabase() {
            return new Promise((resolve) => {
                const check = () => {
                    if (window.supabase && window.supabase.createClient) resolve();
                    else setTimeout(check, 100);
                };
                check();
            });
        }

        async function getConfig() {
            try {
                // Mencoba fetch dari API backend
                const res = await fetch('/api/config');
                return await res.json();
            } catch (err) {
                // Fallback: Jika di lingkungan Canvas (lokal), kembalikan null untuk indikasi error
                console.warn("API backend tidak ditemukan, menggunakan simulasi.");
                return null;
            }
        }

        function handleAuthState(session) {
            currentUser = session?.user;
            const loginBtn = document.getElementById('login-btn');
            const userProfile = document.getElementById('user-profile');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');

            if (currentUser) {
                loginBtn.classList.add('hidden');
                userProfile.classList.remove('hidden');
                document.getElementById('user-avatar').src = currentUser.user_metadata?.avatar_url || '';
                userInput.disabled = false;
                sendBtn.disabled = false;
            } else {
                loginBtn.classList.remove('hidden');
                userProfile.classList.add('hidden');
                userInput.disabled = true;
                sendBtn.disabled = true;
            }
        }

        async function loginGoogle() {
            if (!window.myAppSupabase) return;
            await window.myAppSupabase.auth.signInWithOAuth({ provider: 'google' });
        }

        async function logout() {
            if (!window.myAppSupabase) return;
            await window.myAppSupabase.auth.signOut();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;
            input.value = '';
        }

        async function initApp() {
            try {
                await waitForSupabase();
                const config = await getConfig();
                
                if (config && config.url && config.anonKey) {
                    window.myAppSupabase = window.supabase.createClient(config.url, config.anonKey);
                    
                    const { data: { session } } = await window.myAppSupabase.auth.getSession();
                    handleAuthState(session);
                    window.myAppSupabase.auth.onAuthStateChange((_, session) => handleAuthState(session));
                } else {
                    document.getElementById('initial-loader').innerHTML = "<p class='text-red-500'>Konfigurasi Supabase tidak ditemukan (Backend API tidak aktif).</p>";
                    return;
                }

                document.getElementById('initial-loader').style.display = 'none';
                document.getElementById('main-header').classList.remove('opacity-0');
                document.getElementById('chat-container').classList.remove('opacity-0');
                document.getElementById('main-footer').classList.remove('opacity-0');
            } catch (err) {
                console.error("Error Inisialisasi:", err);
                document.getElementById('initial-loader').innerText = "Gagal memuat: " + err.message;
            }
        }
        
        initApp();
    </script>
</body>
</html>
