<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asisten AI Gemini</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js untuk merender Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- DOMPurify untuk keamanan mencegah XSS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom styling untuk Markdown */
        .markdown-body p { margin-bottom: 0.75em; line-height: 1.6; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body pre { background-color: #1e293b; color: #f8fafc; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1em; font-size: 0.875rem; }
        .markdown-body code { background-color: #e2e8f0; color: #b91c1c; padding: 0.125rem 0.25rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.875rem;}
        .markdown-body pre code { background-color: transparent; color: inherit; padding: 0; border-radius: 0; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1em; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1em; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 600; margin-top: 1.5em; margin-bottom: 0.5em; }
        .markdown-body strong { font-weight: 600; color: #111827; }
        
        /* Animasi Loading */
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.5s infinite ease-in-out;
            margin: 0 2px;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.3s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.15s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-gray-200 shadow-sm z-10 flex-shrink-0">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-md">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 12 2.32 6.36"></path><path d="m12 12 9.68-5.64"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-xl text-gray-900 leading-tight">Gemini AI</h1>
                    <p class="text-xs text-gray-500">Aman dengan Vercel ENV</p>
                </div>
            </div>
            <button onclick="clearChat()" class="text-sm text-gray-500 hover:text-red-500 transition-colors flex items-center gap-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                Hapus
            </button>
        </div>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto w-full max-w-4xl mx-auto p-4 flex flex-col gap-6 relative">
        <div class="flex gap-4 mt-4">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white flex-shrink-0 mt-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path></svg>
            </div>
            <div class="bg-white border border-gray-100 shadow-sm p-4 rounded-2xl rounded-tl-none max-w-[85%] text-gray-700">
                <p>Halo! Saya sudah diatur menggunakan arsitektur Vercel Serverless. Silakan bertanya!</p>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 p-4 pb-6 sm:pb-4 flex-shrink-0">
        <div class="max-w-4xl mx-auto relative flex items-end gap-2">
            <textarea 
                id="user-input" 
                rows="1"
                class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-2xl focus:ring-blue-500 focus:border-blue-500 block p-3 pr-12 resize-none overflow-hidden min-h-[48px] max-h-32 transition-all" 
                placeholder="Ketik pesan Anda..."
                oninput="adjustTextareaHeight(this)"
                onkeydown="handleKeyDown(event)"
            ></textarea>
            
            <button 
                id="send-btn"
                onclick="sendMessage()" 
                class="absolute right-2 bottom-1.5 p-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition-colors flex items-center justify-center h-[36px] w-[36px] disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let isWaitingForResponse = false;

        function adjustTextareaHeight(el) {
            el.style.height = 'auto';
            el.style.height = (el.scrollHeight) + 'px';
            if (el.value === "") el.style.height = '48px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function appendMessage(sender, text) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex gap-4 ${sender === 'user' ? 'flex-row-reverse' : ''}`;
            
            let avatar = sender === 'user' 
                ? `<div class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-white flex-shrink-0 mt-1"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>`
                : `<div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white flex-shrink-0 mt-1 shadow-sm"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path></svg></div>`;
            
            let bubbleClasses = sender === 'user'
                ? 'bg-blue-600 text-white rounded-2xl rounded-tr-none px-4 py-3 max-w-[85%]'
                : 'bg-white border border-gray-100 shadow-sm p-4 rounded-2xl rounded-tl-none max-w-[85%] text-gray-800 markdown-body';
            
            let content = '';
            if (sender === 'user') {
                content = text.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
            } else {
                if (text === 'loading') {
                    content = `<div class="typing-indicator flex items-center h-5"><span></span><span></span><span></span></div>`;
                    wrapper.id = 'loading-message';
                } else {
                    const rawHtml = marked.parse(text);
                    content = DOMPurify.sanitize(rawHtml);
                }
            }

            wrapper.innerHTML = `${avatar}<div class="${bubbleClasses}">${content}</div>`;
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function removeLoading() {
            const loadingMsg = document.getElementById('loading-message');
            if (loadingMsg) loadingMsg.remove();
        }

        function clearChat() {
            while (chatContainer.children.length > 1) {
                chatContainer.removeChild(chatContainer.lastChild);
            }
        }

        async function fetchWithRetry(url, options, maxRetries = 3) {
            const delays = [1000, 2000, 4000];
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    
                    // Coba parsing JSON, tangani error jika bukan JSON
                    let data;
                    try {
                        data = await response.json();
                    } catch (e) {
                        throw new Error(`Respons tidak valid dari server (${response.status}). Pastikan /api/chat tersedia.`);
                    }
                    
                    if (!response.ok) {
                        throw new Error(data.error || `HTTP error! status: ${response.status}`);
                    }
                    return data;
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

        async function sendMessage() {
            if (isWaitingForResponse) return;

            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            adjustTextareaHeight(userInput);
            
            isWaitingForResponse = true;
            sendBtn.disabled = true;
            userInput.disabled = true;
            appendMessage('bot', 'loading');

            // ⚠️ MENGARAH KE BACKEND LOKAL VERCEL (/api/chat) ⚠️
            const url = '/api/chat';
            const options = {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            };

            try {
                const data = await fetchWithRetry(url, options);
                removeLoading();
                
                const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (responseText) {
                    appendMessage('bot', responseText);
                } else {
                    appendMessage('bot', "*Maaf, saya mendapat respons kosong dari server.*");
                }
            } catch (error) {
                removeLoading();
                appendMessage('bot', `*Error:* ${error.message}\n\n(Catatan: Jika Anda sedang menguji di Canvas/Preview, ini wajar karena environment Canvas tidak menjalankan file backend \`/api/chat\`. Ini akan berfungsi normal saat di-deploy ke Vercel).`);
            } finally {
                isWaitingForResponse = false;
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }
    </script>
</body>
</html>
