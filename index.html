
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Asisten AI pintar dengan fitur multi-model (Gemini & Groq Llama 3) yang responsif, SEO friendly, dan cepat.">
    <meta name="theme-color" content="#4f46e5">
    <link rel="canonical" href="https://theproperside.vercel.app">
    
    <title>Asisten AI Multi-Model - Chat Pintar & Cepat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .chat-msg { max-width: 90%; margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 1rem; line-height: 1.6; }
        .msg-user { align-self: flex-end; background-color: #4f46e5; color: white; border-bottom-right-radius: 0.25rem; }
        .msg-ai { align-self: flex-start; background-color: #f3f4f6; color: #1f2937; border-bottom-left-radius: 0.25rem; }
        
        /* Perbaikan CSS untuk Code Block agar bisa di-scroll */
        .code-container { position: relative; margin: 0.75rem 0; }
        pre { 
            background: #282c34 !important; 
            border-radius: 0.5rem; 
            padding: 1rem !important; 
            padding-top: 2.5rem !important; /* Ruang untuk tombol salin */
            margin: 0; 
            overflow: auto; 
            max-height: 400px; /* Batasan tinggi maksimal (muncul scroll jika lewat) */
        }
        code { font-family: 'Fira Code', 'Consolas', monospace; font-size: 0.875rem; color: #abb2bf; display: block; white-space: pre; }
        
        /* Styling Tombol Salin agar tetap di atas saat di-scroll */
        .copy-btn { position: absolute; top: 0.5rem; right: 0.5rem; background: #4b5563; color: white; padding: 0.25rem 0.5rem; font-size: 0.7rem; border-radius: 0.25rem; cursor: pointer; z-index: 10; border: none; transition: background 0.2s;}
        .copy-btn:hover { background: #374151; }
        
        /* Custom Scrollbar agar terlihat lebih rapi di dalam kotak kode */
        pre::-webkit-scrollbar { width: 6px; height: 6px; }
        pre::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
        pre::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        pre::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        
        #initial-loader { position: fixed; inset: 0; background: white; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        textarea::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

    <div id="initial-loader">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-indigo-600 mb-3"></div>
        <p class="text-sm text-gray-500">Menyiapkan asisten AI Anda...</p>
    </div>

    <header class="bg-white border-b border-gray-200 shadow-sm z-10 flex-shrink-0 opacity-0 transition-opacity duration-500" id="main-header">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="font-bold text-lg text-indigo-600 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Multi AI Chat
            </h1>
            <div class="flex items-center gap-3">
                <select id="model-selector" class="bg-gray-50 border border-gray-300 text-xs rounded-lg p-2 cursor-pointer outline-none focus:ring-1 focus:ring-indigo-500">
                    <option value="gemini">Gemini 1.5</option>
                    <option value="groq">Groq (Llama 3)</option>
                </select>
                <button id="login-btn" onclick="loginGoogle()" class="hidden bg-indigo-600 text-white text-xs font-medium py-2 px-4 rounded-lg hover:bg-indigo-700 transition shadow-sm">Login Google</button>
                <div id="user-profile" class="hidden items-center gap-3">
                    <img id="user-avatar" src="" alt="Avatar" class="w-8 h-8 rounded-full border border-gray-200 shadow-sm object-cover">
                    <button onclick="logout()" class="text-gray-500 text-xs hover:text-red-600 transition font-medium">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto w-full max-w-5xl mx-auto p-4 flex flex-col opacity-0 transition-opacity duration-500 scroll-smooth"></main>

    <footer id="main-footer" class="bg-white border-t p-3 pb-6 flex-shrink-0 opacity-0 transition-opacity duration-500">
        <div class="max-w-5xl mx-auto relative flex items-end gap-2 bg-gray-50 border border-gray-300 rounded-2xl focus-within:ring-2 focus-within:ring-indigo-500 transition-shadow">
            <textarea id="user-input" disabled rows="1" class="w-full bg-transparent text-sm p-4 pr-14 outline-none disabled:opacity-60 resize-none max-h-32" placeholder="Ketik pesan Anda... (Tekan Enter untuk mengirim)"></textarea>
            <button id="send-btn" disabled onclick="sendMessage()" class="absolute right-2 bottom-2 p-2 bg-indigo-600 text-white rounded-xl shadow-sm hover:bg-indigo-700 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center h-10 w-10">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
        </div>
    </footer>

    <script>
        window.myAppSupabase = null;
        let currentUser = null;
        let isWaitingForResponse = false;

        // Membungkus blok kode dengan container agar tombol salin tetap melayang saat di-scroll
        marked.use({
            renderer: {
                code(token) {
                    let codeText = typeof token === 'object' ? token.text : arguments[0];
                    let lang = typeof token === 'object' ? token.lang : arguments[1];
                    
                    if (!codeText) codeText = '';
                    const escapedCode = String(codeText).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    
                    return `<div class="code-container">
                                <button class="copy-btn bg-gray-600">Salin</button>
                                <pre><code class="language-${lang || 'plaintext'}">${escapedCode}</code></pre>
                            </div>`;
                }
            }
        });

        document.getElementById('chat-container').addEventListener('click', function(e) {
            if (e.target && e.target.classList.contains('copy-btn')) {
                copyToClipboard(e.target);
            }
        });

        async function waitForSupabase() {
            return new Promise((resolve) => {
                const check = () => {
                    if (window.supabase && window.supabase.createClient) resolve();
                    else setTimeout(check, 100);
                };
                check();
            });
        }

        function copyToClipboard(btn) {
            // Mencari elemen <code> yang ada di dalam <pre> di sebelah tombol
            const codeBlock = btn.nextElementSibling.querySelector('code');
            const code = codeBlock.textContent || codeBlock.innerText;
            
            try {
                navigator.clipboard.writeText(code);
            } catch (err) {
                const textArea = document.createElement("textarea");
                textArea.value = code;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
            }
            
            const originalText = btn.innerText;
            btn.innerText = 'Tersalin!';
            btn.classList.replace('bg-gray-600', 'bg-green-600');
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace('bg-green-600', 'bg-gray-600');
            }, 2000);
        }

        function appendMessage(text, isUser) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `chat-msg ${isUser ? 'msg-user' : 'msg-ai'}`;
            
            if (isUser) {
                div.textContent = text;
            } else {
                div.innerHTML = DOMPurify.sanitize(marked.parse(text));
            }
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            
            div.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
        }

        function handleAuthState(session) {
            currentUser = session?.user;
            const loginBtn = document.getElementById('login-btn');
            const userProfile = document.getElementById('user-profile');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');

            if (currentUser) {
                loginBtn.classList.add('hidden');
                userProfile.classList.remove('hidden');
                userProfile.classList.add('flex');
                document.getElementById('user-avatar').src = currentUser.user_metadata?.avatar_url || 'https://ui-avatars.com/api/?name=User&background=random';
                
                if (!isWaitingForResponse) {
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                    userInput.placeholder = "Ketik pesan Anda... (Tekan Enter untuk mengirim)";
                }
            } else {
                loginBtn.classList.remove('hidden');
                userProfile.classList.add('hidden');
                userProfile.classList.remove('flex');
                userInput.disabled = true;
                sendBtn.disabled = true;
                userInput.placeholder = "Silakan login terlebih dahulu untuk memulai chat.";
            }
        }

        async function loginGoogle() {
            if (!window.myAppSupabase) return;
            try {
                await window.myAppSupabase.auth.signInWithOAuth({ 
                    provider: 'google',
                    options: { redirectTo: window.location.origin }
                });
            } catch (error) {
                alert("Gagal memanggil antarmuka login: " + error.message);
            }
        }

        async function logout() {
            if (!window.myAppSupabase) return;
            await window.myAppSupabase.auth.signOut();
            document.getElementById('chat-container').innerHTML = ''; 
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const modelSelector = document.getElementById('model-selector');
            const sendBtn = document.getElementById('send-btn');
            const text = input.value.trim();
            
            if(!text || isWaitingForResponse) return;
            
            isWaitingForResponse = true;
            appendMessage(text, true);
            input.value = '';
            input.style.height = 'auto'; 
            input.disabled = true;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<div class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></div>';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, modelProvider: modelSelector.value })
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const data = await response.json();
                
                if (data.reply) {
                    appendMessage(data.reply, false);
                } else {
                    appendMessage("Error: " + (data.error || "Terjadi kesalahan pada server AI."), false);
                }
            } catch (err) {
                appendMessage("⚠️ Gagal terhubung ke server. Pastikan Anda memiliki endpoint backend /api/chat yang aktif. Detail: " + err.message, false);
            } finally {
                isWaitingForResponse = false;
                input.disabled = false;
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg>';
                input.focus();
            }
        }

        const userInput = document.getElementById('user-input');

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); 
                sendMessage();
            }
        });

        async function initApp() {
            try {
                await waitForSupabase();
                const supabaseUrl = "https://mjvgnxiudhnuaccxnsnh.supabase.co"; 
                const supabaseAnonKey = "sb_publishable_-zoS7TeFgb9QZkhnuZe28A_jnj1Xno6";
                
                if (supabaseUrl && supabaseAnonKey && !supabaseUrl.includes("MASUKKAN")) {
                    window.myAppSupabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
                    const { data: { session } } = await window.myAppSupabase.auth.getSession();
                    handleAuthState(session);
                    window.myAppSupabase.auth.onAuthStateChange((_, session) => handleAuthState(session));
                } else {
                    document.getElementById('user-input').placeholder = "Kredensial Supabase belum dikonfigurasi.";
                }
            } catch (err) {
                console.error("Gagal menginisialisasi Supabase:", err);
            } finally {
                document.getElementById('initial-loader').style.display = 'none';
                document.getElementById('main-header').classList.remove('opacity-0');
                document.getElementById('chat-container').classList.remove('opacity-0');
                document.getElementById('main-footer').classList.remove('opacity-0');
            }
        }
        
        initApp();
    </script>
</body>
</html>
